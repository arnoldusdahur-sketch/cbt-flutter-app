workflows:
  ios-simulator-build:
    name: Flutter iOS Simulator for Appetize
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Packages Get
        script: |
          flutter packages pub get
      - name: Build iOS Simulator
        script: |
          # Build simulator .app tanpa sertifikat developer
          flutter build ios --simulator --no-codesign
          # Masuk ke folder output build simulator
          cd build/ios/iphonesimulator
          # Kompres Runner.app menjadi Runner.zip agar dikenali Appetize
          zip -r Runner.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/Runner.zip
    publishing:
      appetize:
        token: tok_wzmvs2gv5gp557fwnrpp6kv644

name: otwasn_app
description: OTWASN - Platform Simulasi CAT CPNS & PPPK. Aplikasi resmi untuk Android dan iOS.
publish_to: 'none'

version: 1.2.4+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.10.0

  # Storage & Preferences
  shared_preferences: ^2.3.2

  # Network
  http: ^1.2.2

  # Package info (get version code)
  package_info_plus: ^8.1.2

  # File paths (for APK download)
  path_provider: ^2.1.5

  # URL Launcher (open external links)
  url_launcher: ^6.3.1

  # Connectivity check
  connectivity_plus: ^6.1.1

  # App icons
  flutter_launcher_icons: ^0.14.3

  # Splash screen
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png

# Launcher icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

# Splash screen configuration
flutter_native_splash:
  color: "#1E293B"
  image: assets/logo.png
  android: true
  ios: true
  android_12:
    image: assets/logo.png
    color: "#1E293B"
    icon_background_color: "#1E293B"
